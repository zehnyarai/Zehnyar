plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'expo-module-gradle-plugin'
}

group = 'host.exp.exponent'
version = '1.0.0'

android {
  namespace "expo.modules.myketbilling"
  compileSdkVersion safeExtGet("compileSdkVersion", 34)
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 21)
    targetSdkVersion safeExtGet("targetSdkVersion", 34)
    versionCode 1
    versionName "1.0.0"
    manifestPlaceholders = [
      marketApplicationId: "ir.mservices.market",
      marketBindAddress: "ir.mservices.market.InAppBillingService.BIND",
      marketPermission: "ir.mservices.market.BILLING"
    ]
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
  kotlinOptions {
    jvmTarget = '1.8'
  }
}

repositories {
  maven { url 'https://maven.myket.ir' }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "ir.myket:billing:2.2"
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
