services:
  - type: web
    name: mohajeryar
    runtime: python
    # پلن starter برای دیسک پایدار SQLite لازم است؛ روی پلن free بلوک disk را حذف کنید
    # (در آن حالت داده‌ها با هر بازاستقرار پاک می‌شوند).
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/mohajeryar.db
      - key: GROQ_API_KEY
        sync: false
    disk:
      name: mohajeryar-data
      mountPath: /var/data
      sizeGB: 1
