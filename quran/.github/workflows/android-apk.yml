name: قرآن‌پژوهه Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish or update the mobile-latest prerelease"
        required: true
        default: false
        type: boolean
  push:
    paths:
      - "mobile/**"
      - "static/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify Quran Pajoohe app identity
        run: grep -Fq 'android:label="قرآن‌پژوهه"' mobile/android/app/src/main/AndroidManifest.xml

      - name: Build installable debug APK
        run: gradle --no-daemon -p mobile/android assembleDebug

      - name: Name the Quran Pajoohe installer
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" mobile/android/app/build.gradle | head -n1)"
          test -n "$VERSION"
          APK_PATH="mobile/android/app/build/outputs/apk/debug/QuranPajoohe-${VERSION}.apk"
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "$APK_PATH"
          echo "QURAN_APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload Quran Pajoohe APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-pajoohe-android-apk
          path: ${{ env.QURAN_APK_PATH }}
          if-no-files-found: error

      - name: Publish latest prerelease
        # A source update that rebuilds the APK also refreshes the stable download
        # link; workflow_dispatch keeps a manual republish option.
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          target_commitish: ${{ github.sha }}
          name: "قرآن‌پژوهه برای اندروید — آخرین نسخه"
          prerelease: true
          generate_release_notes: true
          files: ${{ env.QURAN_APK_PATH }}
