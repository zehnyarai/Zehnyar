name: Android release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the GitHub release (empty = read from the pushed tag)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ github.event.inputs.version != '' && github.event.inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '2.0.0') }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
      ANDROID_KEY_ALIAS: zehnyar
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'zehnyar-release-2026' }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'zehnyar-release-2026' }}
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild dataset and sync to the app bundle
        run: |
          python3 tools/build_dataset.py
          node tools/sync_mobile_data.js
          node tools/check_i18n.js

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Restore or create the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
            echo "Using keystore from repository secrets."
          else
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore "$ANDROID_KEYSTORE_PATH" \
              -alias "$ANDROID_KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" \
              -dname "CN=Zehnyar, OU=Mobile, O=Zehnyar, L=Amsterdam, C=NL"
            echo "Generated an ephemeral keystore. Add the uploaded keystore artifact to GitHub secrets to keep a stable signing key."
          fi

      - name: Prebuild Android project
        working-directory: mobile
        run: npx expo prebuild -p android --clean --no-install

      - name: Configure release signing
        run: node tools/android_prepare.js

      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p release
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "release/Zehnyar-${RELEASE_VERSION#v}-universal.apk"
          cp "$ANDROID_KEYSTORE_PATH" release/zehnyar-release.keystore
          sha256sum release/*.apk > release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zehnyar-release-apk
          path: release/Zehnyar-*-universal.apk
          retention-days: 90

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: zehnyar-release-keystore
          path: release/zehnyar-release.keystore
          retention-days: 90

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(RELEASE_VERSION, 'v') && RELEASE_VERSION || format('v{0}', RELEASE_VERSION) }}
          name: Zehnyar ${{ RELEASE_VERSION }} — Android release
          body: |
            Signed universal release APK for Zehnyar ${{ RELEASE_VERSION }}.

            - Package: `ai.zehnyar.app`
            - All ABIs in one file (arm64-v8a, armeabi-v7a, x86, x86_64)
            - Bundled Vazirmatn fonts and the full offline dataset
            - Ready to upload to Google Play, Cafe Bazaar and Myket

            Install: copy the APK to the phone, allow installation from this source, and open it.
          files: |
            release/Zehnyar-*-universal.apk
            release/SHA256SUMS.txt
          draft: false
          prerelease: false
