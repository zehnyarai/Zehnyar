name: Android release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number only, e.g. 2.3.14. Do not enter a branch name; empty uses the app version/tag.'
        required: false
        default: ''
      bazaar_draft:
        description: 'Build a non-public Cafe Bazaar registration draft (payments disabled)'
        required: false
        type: boolean
        default: true
      bazaar_iab:
        description: 'Build Cafe Bazaar in-app billing APK (requires the Bazaar products and HTTPS API to be configured)'
        required: false
        type: boolean
        default: false
      myket_iab:
        description: 'Build Myket in-app billing APK (requires the Myket products and HTTPS API to be configured)'
        required: false
        type: boolean
        default: false
      publish_release:
        description: 'Publish a public GitHub release (leave off for a test build)'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - 'arena/4143af50-zehnyar'
      - 'arena/96fa3fb8-zehnyar'
      - 'arena/5ee93ac8-zehnyar'
      - 'arena/fe5d970d-zehnyar'
      - 'arena/44d5574b-zehnyar'
      - 'arena/2e1bd3bb-zehnyar'
      - 'main'
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
      ANDROID_KEY_ALIAS: zehnyar
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version and build mode
        id: resolve-release
        run: |
          set -euo pipefail
          RAW="${{ github.event.inputs.version }}"
          BAZAAR_DRAFT=false
          BAZAAR_IAB=false
          MYKET_IAB=false
          if [[ "$RAW" == draft-* ]]; then
            BAZAAR_DRAFT=true
            RAW="${RAW#draft-}"
          elif [[ "${{ inputs.bazaar_draft }}" == "true" ]]; then
            BAZAAR_DRAFT=true
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/arena/fe5d970d-zehnyar" ]]; then
            BAZAAR_DRAFT=true
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/arena/44d5574b-zehnyar" ]]; then
            BAZAAR_IAB=true
            BAZAAR_DRAFT=false
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/arena/2e1bd3bb-zehnyar" ]]; then
            MYKET_IAB=true
            BAZAAR_DRAFT=false
          fi
          if [[ "${{ inputs.bazaar_iab }}" == "true" ]]; then
            BAZAAR_IAB=true
            BAZAAR_DRAFT=false
          fi
          if [[ "${{ inputs.myket_iab }}" == "true" ]]; then
            MYKET_IAB=true
            BAZAAR_DRAFT=false
          fi
          if [ -z "$RAW" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RAW="${GITHUB_REF_NAME}"
          fi
          if [ -z "$RAW" ]; then
            RAW="$(node -p "require('./mobile/app.json').expo.version")"
          fi
          VERSION="${RAW#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Enter a version number such as 2.3.14 in the Version field; choose the branch only in the 'Use workflow from' dropdown."
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "bazaar_draft=$BAZAAR_DRAFT" >> "$GITHUB_OUTPUT"
          echo "bazaar_iab=$BAZAAR_IAB" >> "$GITHUB_OUTPUT"
          echo "myket_iab=$MYKET_IAB" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $VERSION"
          if [ "$BAZAAR_DRAFT" = true ]; then echo 'Building non-public Cafe Bazaar registration draft; payments remain disabled.'; fi
          if [ "$BAZAAR_IAB" = true ]; then echo 'Building Cafe Bazaar in-app billing APK with signed purchase verification and server-side credit grants.'; fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild dataset and sync to the app bundle
        run: |
          python3 tools/build_dataset.py
          node tools/sync_mobile_data.js
          node tools/check_i18n.js
      - name: Block release when reference data is stale
        run: python3 tools/check_dataset_freshness.py --fail-when-stale

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Configure and validate stable release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_PASSWORD as repository Actions secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          if ! KEY_INFO="$(keytool -list -v -storetype JKS -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" 2>&1)"; then
            echo "::error::Unable to read the JKS keystore. Check its base64 value, store password, and alias."
            printf '%s\n' "$KEY_INFO"
            exit 1
          fi
          if printf '%s\n' "$KEY_INFO" | grep -Eqi 'Owner:.*Android Debug'; then
            echo "::error::Configured keystore is Android's debug key; use the actual release keystore."
            exit 1
          fi
          echo "Stable non-debug release signing key validated; key data hidden."

      - name: Validate payment configuration without exposing card data
        if: ${{ steps.resolve-release.outputs.bazaar_draft != 'true' && steps.resolve-release.outputs.bazaar_iab != 'true' && steps.resolve-release.outputs.myket_iab != 'true' }}
        working-directory: mobile
        env:
          VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
          VISAYAR_PAYMENT_CARD_NUMBER: ${{ secrets.VISAYAR_PAYMENT_CARD_NUMBER }}
          VISAYAR_PAYMENT_CARD_HOLDER: ${{ secrets.VISAYAR_PAYMENT_CARD_HOLDER }}
          VISAYAR_PAYMENT_BANK_NAME: ${{ secrets.VISAYAR_PAYMENT_BANK_NAME }}
        run: |
          node <<'NODE'
          const config = require('./app.config.js');
          const card = config.extra.paymentCard || {};
          const rawCard = String(process.env.VISAYAR_PAYMENT_CARD_NUMBER || '').replace(/\D/g, '');
          const apiBase = String(process.env.VISAYAR_API_BASE_URL || '').trim();
          const secureApi = /^https:\/\/[^/]+(?:\/.*)?$/.test(apiBase);
          if (apiBase && !secureApi) {
            console.error('VISAYAR_API_BASE_URL must be a valid HTTPS URL.');
            process.exit(1);
          }
          if (rawCard && (!card.number || card.number.length !== 16)) {
            console.error('The configured static card secret is invalid.');
            process.exit(1);
          }
          if (!secureApi && (!card.number || card.number.length !== 16)) {
            console.error('Configure a secure HTTPS API URL, or add a valid card secret for offline mode.');
            process.exit(1);
          }
          console.log(secureApi ? 'Secure API configuration validated; card may be fetched from the server.' : 'Static card configuration validated; value hidden.');
          NODE

      - name: Validate secure backend for Cafe Bazaar IAB
        if: ${{ steps.resolve-release.outputs.bazaar_iab == 'true' }}
        env:
          VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ ! "$VISAYAR_API_BASE_URL" =~ ^https://[^/]+([/].*)?$ ]]; then
            echo "::error::Configure VISAYAR_API_BASE_URL as HTTPS before building the Bazaar IAB APK."
            exit 1
          fi
          echo "HTTPS purchase-verification backend configured; URL omitted."

      - name: Embed an optional static card fallback for Android runtime
        if: ${{ steps.resolve-release.outputs.bazaar_draft != 'true' && steps.resolve-release.outputs.bazaar_iab != 'true' && steps.resolve-release.outputs.myket_iab != 'true' }}
        working-directory: mobile
        env:
          VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
          VISAYAR_PAYMENT_CARD_NUMBER: ${{ secrets.VISAYAR_PAYMENT_CARD_NUMBER }}
          VISAYAR_PAYMENT_CARD_HOLDER: ${{ secrets.VISAYAR_PAYMENT_CARD_HOLDER }}
          VISAYAR_PAYMENT_BANK_NAME: ${{ secrets.VISAYAR_PAYMENT_BANK_NAME }}
        run: node ../tools/write_mobile_payment_card.js

      - name: Prebuild Android project
        if: ${{ steps.resolve-release.outputs.bazaar_draft != 'true' && steps.resolve-release.outputs.bazaar_iab != 'true' && steps.resolve-release.outputs.myket_iab != 'true' }}
        working-directory: mobile
        env:
          VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
          EXPO_PUBLIC_VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
          VISAYAR_PAYMENT_CARD_NUMBER: ${{ secrets.VISAYAR_PAYMENT_CARD_NUMBER }}
          VISAYAR_PAYMENT_CARD_HOLDER: ${{ secrets.VISAYAR_PAYMENT_CARD_HOLDER }}
          VISAYAR_PAYMENT_BANK_NAME: ${{ secrets.VISAYAR_PAYMENT_BANK_NAME }}
          VISAYAR_CAFEBAZAAR_IAB: '0'
        run: npx expo prebuild -p android --clean --no-install

      - name: Prebuild Cafe Bazaar registration draft without payment secrets
        if: ${{ steps.resolve-release.outputs.bazaar_draft == 'true' }}
        working-directory: mobile
        env:
          VISAYAR_API_BASE_URL: ''
          EXPO_PUBLIC_VISAYAR_API_BASE_URL: ''
          VISAYAR_PAYMENT_CARD_NUMBER: ''
          VISAYAR_PAYMENT_CARD_HOLDER: ''
          VISAYAR_PAYMENT_BANK_NAME: ''
          VISAYAR_CAFEBAZAAR_IAB: '0'
        run: npx expo prebuild -p android --clean --no-install

      - name: Prebuild Cafe Bazaar IAB APK
        if: ${{ steps.resolve-release.outputs.bazaar_iab == 'true' }}
        working-directory: mobile
        env:
          VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
          EXPO_PUBLIC_VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
          VISAYAR_PAYMENT_CARD_NUMBER: ''
          VISAYAR_PAYMENT_CARD_HOLDER: ''
          VISAYAR_PAYMENT_BANK_NAME: ''
          VISAYAR_CAFEBAZAAR_IAB: '1'
        run: npx expo prebuild -p android --clean --no-install

      - name: Prebuild Myket IAB APK
        if: ${{ steps.resolve-release.outputs.myket_iab == 'true' }}
        working-directory: mobile
        env:
          VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
          EXPO_PUBLIC_VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
          VISAYAR_PAYMENT_CARD_NUMBER: ''
          VISAYAR_PAYMENT_CARD_HOLDER: ''
          VISAYAR_PAYMENT_BANK_NAME: ''
          VISAYAR_STORE: myket
          VISAYAR_MYKET_IAB: '1'
          VISAYAR_MYKET_RSA_PUBLIC_KEY: ${{ secrets.VISAYAR_MYKET_RSA_PUBLIC_KEY }}
          VISAYAR_CAFEBAZAAR_IAB: '0'
        run: |
          test -n "$VISAYAR_MYKET_RSA_PUBLIC_KEY" || { echo '::error::Missing VISAYAR_MYKET_RSA_PUBLIC_KEY'; exit 1; }
          # The Bazaar and Myket SDKs both contain IInAppBillingService. Only
          # link the Myket native module into this APK (no lockfile changes).
          node <<'NODE'
          const fs = require('fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.expo = pkg.expo || {};
          pkg.expo.autolinking = pkg.expo.autolinking || {};
          pkg.expo.autolinking.android = pkg.expo.autolinking.android || {};
          pkg.expo.autolinking.android.exclude = [
            ...new Set([...(pkg.expo.autolinking.android.exclude || []), 'expo-cafebazaar-billing']),
          ];
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npx expo-modules-autolinking resolve --platform android --json | node -e "let raw='';process.stdin.on('data',x=>raw+=x);process.stdin.on('end',()=>{const names=JSON.parse(raw).modules.map(m=>m.packageName);if(names.includes('expo-cafebazaar-billing')||!names.includes('expo-myket-billing')||!JSON.parse(raw).modules.some(m=>m.packageName==='expo-myket-billing'&&m.projects.some(p=>p.modules.includes('expo.modules.myketbilling.MyketBillingModule')))){console.error('Incorrect Myket native module selection');process.exit(1)}console.log('Only Myket billing native module selected')})"
          node -e "const fs=require('fs');const path=require.resolve('expo-myket-billing');if(!fs.existsSync(path))throw Error('Myket JS entry point missing');console.log('Myket JS entry point:',path)"
          npx expo prebuild -p android --clean --no-install
          grep -Fq 'maven.myket.ir' android/settings.gradle || { echo '::error::Myket Maven repository missing from settings.gradle'; exit 1; }
          grep -Fq 'maven.myket.ir' android/build.gradle || { echo '::error::Myket Maven repository missing from root build.gradle'; exit 1; }
          grep -Fq "marketApplicationId: 'ir.mservices.market'" android/app/build.gradle || { echo '::error::Myket app manifest placeholders missing'; exit 1; }
          grep -Fq "excludes += 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'" android/app/build.gradle || { echo '::error::Myket OSGi metadata packaging exclusion missing'; exit 1; }

      - name: Configure release signing
        run: node tools/android_prepare.js

      - name: Build release APK
        if: ${{ steps.resolve-release.outputs.bazaar_draft != 'true' && steps.resolve-release.outputs.bazaar_iab != 'true' && steps.resolve-release.outputs.myket_iab != 'true' }}
        working-directory: mobile/android
        env:
          VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
          EXPO_PUBLIC_VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
          VISAYAR_PAYMENT_CARD_NUMBER: ${{ secrets.VISAYAR_PAYMENT_CARD_NUMBER }}
          VISAYAR_PAYMENT_CARD_HOLDER: ${{ secrets.VISAYAR_PAYMENT_CARD_HOLDER }}
          VISAYAR_PAYMENT_BANK_NAME: ${{ secrets.VISAYAR_PAYMENT_BANK_NAME }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Build Cafe Bazaar registration draft APK
        if: ${{ steps.resolve-release.outputs.bazaar_draft == 'true' }}
        working-directory: mobile/android
        env:
          VISAYAR_API_BASE_URL: ''
          EXPO_PUBLIC_VISAYAR_API_BASE_URL: ''
          VISAYAR_PAYMENT_CARD_NUMBER: ''
          VISAYAR_PAYMENT_CARD_HOLDER: ''
          VISAYAR_PAYMENT_BANK_NAME: ''
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Build Cafe Bazaar IAB APK
        if: ${{ steps.resolve-release.outputs.bazaar_iab == 'true' }}
        working-directory: mobile/android
        env:
          VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
          EXPO_PUBLIC_VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
          VISAYAR_PAYMENT_CARD_NUMBER: ''
          VISAYAR_PAYMENT_CARD_HOLDER: ''
          VISAYAR_PAYMENT_BANK_NAME: ''
          VISAYAR_CAFEBAZAAR_IAB: '1'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Validate Myket native code, dependencies and manifest
        if: ${{ steps.resolve-release.outputs.myket_iab == 'true' }}
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew :expo-myket-billing:compileReleaseKotlin :app:checkReleaseDuplicateClasses :app:processReleaseMainManifest --no-daemon

      - name: Build Myket IAB APK
        if: ${{ steps.resolve-release.outputs.myket_iab == 'true' }}
        working-directory: mobile/android
        env:
          VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
          EXPO_PUBLIC_VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
          VISAYAR_PAYMENT_CARD_NUMBER: ''
          VISAYAR_PAYMENT_CARD_HOLDER: ''
          VISAYAR_PAYMENT_BANK_NAME: ''
          VISAYAR_STORE: myket
          VISAYAR_MYKET_IAB: '1'
          VISAYAR_CAFEBAZAAR_IAB: '0'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK uses the configured non-debug release key
        run: |
          set -euo pipefail
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          python3 tools/verify_android_apk_signature.py "$APKSIGNER" "$APK"

      - name: Verify card fallback or server-backed payments in the Android JS bundle
        if: ${{ steps.resolve-release.outputs.bazaar_draft != 'true' && steps.resolve-release.outputs.bazaar_iab != 'true' && steps.resolve-release.outputs.myket_iab != 'true' }}
        env:
          VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
          VISAYAR_PAYMENT_CARD_NUMBER: ${{ secrets.VISAYAR_PAYMENT_CARD_NUMBER }}
        run: node tools/check_mobile_payment_bundle.js

      - name: Remove generated card source from the workspace
        run: git show HEAD:mobile/src/core/paymentCard.generated.js > mobile/src/core/paymentCard.generated.js

      - name: Verify Cafe Bazaar registration package and embedded app bundle
        if: ${{ steps.resolve-release.outputs.bazaar_draft == 'true' || steps.resolve-release.outputs.bazaar_iab == 'true' || steps.resolve-release.outputs.myket_iab == 'true' }}
        run: |
          set -euo pipefail
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='ai.visayar.app'"
          "$AAPT" dump permissions "$APK" | grep -F 'android.permission.INTERNET'
          if "$AAPT" dump permissions "$APK" | grep -F 'android.permission.SYSTEM_ALERT_WINDOW'; then
            echo "::error::APK still declares SYSTEM_ALERT_WINDOW; refusing to package it."
            exit 1
          fi
          if "$AAPT" dump permissions "$APK" | grep -E 'android.permission.USE_BIOMETRIC|android.permission.USE_FINGERPRINT'; then
            echo "::error::APK still declares biometric/fingerprint permissions; refusing to package it."
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              names = set(apk.namelist())
          assert 'AndroidManifest.xml' in names, 'APK has no Android manifest'
          assert any(n.rsplit('/', 1)[-1].startswith('classes') and n.endswith('.dex') for n in names), 'APK has no dex payload'
          assert any(n.endswith(('.bundle', '.hbc')) for n in names), 'APK has no embedded JavaScript bundle'
          print('Production package and embedded app bundle verified.')
          PY
          if [ "${{ steps.resolve-release.outputs.bazaar_iab }}" = 'true' ]; then
            unzip -p "$APK" assets/index.android.bundle > /tmp/visayar-iab-bundle
            grep -a -q 'CafeBazaarBilling' /tmp/visayar-iab-bundle
            echo 'Cafe Bazaar billing module is present in the IAB JavaScript bundle.'
          fi
          if [ "${{ steps.resolve-release.outputs.myket_iab }}" = 'true' ]; then
            unzip -p "$APK" assets/index.android.bundle > /tmp/visayar-myket-iab-bundle
            grep -a -q 'MyketBilling' /tmp/visayar-myket-iab-bundle
            echo 'Myket billing module is present in the IAB JavaScript bundle.'
          fi

      - name: Preserve signed Cafe Bazaar registration draft
        if: ${{ steps.resolve-release.outputs.bazaar_draft == 'true' && steps.resolve-release.outputs.bazaar_iab != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "release/Visayar-${RELEASE_VERSION}-Bazaar-Draft-universal.apk"

      - name: Prebuild Myket registration APK without Cafe Bazaar permission
        if: ${{ steps.resolve-release.outputs.bazaar_draft == 'true' && steps.resolve-release.outputs.bazaar_iab != 'true' }}
        working-directory: mobile
        env:
          VISAYAR_STORE: myket
          VISAYAR_API_BASE_URL: ''
          EXPO_PUBLIC_VISAYAR_API_BASE_URL: ''
          VISAYAR_PAYMENT_CARD_NUMBER: ''
          VISAYAR_PAYMENT_CARD_HOLDER: ''
          VISAYAR_PAYMENT_BANK_NAME: ''
          VISAYAR_CAFEBAZAAR_IAB: '0'
        run: |
          set -euo pipefail
          node <<'NODE'
          const config = require('./app.config.js');
          const blocked = config.android.blockedPermissions || [];
          const card = config.extra.paymentCard || {};
          if (config.android.package !== 'ai.visayar.app' || !config.extra.myketBuild || config.extra.bazaarIab) {
            throw new Error('Myket store configuration or package identity is invalid.');
          }
          if (!blocked.includes('com.farsitel.bazaar.permission.PAY_THROUGH_BAZAAR')) {
            throw new Error('The Cafe Bazaar-only permission is not blocked for the Myket build.');
          }
          if (config.extra.apiBaseUrl || String(card.number || '').replace(/\D/g, '')) {
            throw new Error('Myket registration drafts must contain no API URL or payment account.');
          }
          console.log('Myket draft config validated: correct package, Bazaar permission blocked, no API/payment data.');
          NODE
          npx expo prebuild -p android --clean --no-install

      - name: Configure Myket APK release signing
        if: ${{ steps.resolve-release.outputs.bazaar_draft == 'true' && steps.resolve-release.outputs.bazaar_iab != 'true' }}
        run: node tools/android_prepare.js

      - name: Build signed Myket registration draft APK
        if: ${{ steps.resolve-release.outputs.bazaar_draft == 'true' && steps.resolve-release.outputs.bazaar_iab != 'true' }}
        working-directory: mobile/android
        env:
          VISAYAR_STORE: myket
          VISAYAR_API_BASE_URL: ''
          EXPO_PUBLIC_VISAYAR_API_BASE_URL: ''
          VISAYAR_PAYMENT_CARD_NUMBER: ''
          VISAYAR_PAYMENT_CARD_HOLDER: ''
          VISAYAR_PAYMENT_BANK_NAME: ''
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify Myket APK package, version, and permissions
        if: ${{ steps.resolve-release.outputs.bazaar_draft == 'true' && steps.resolve-release.outputs.bazaar_iab != 'true' }}
        run: |
          set -euo pipefail
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          BADGING="$($AAPT dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='ai.visayar.app' versionCode='49' versionName='2.3.24'"
          PERMISSIONS="$($AAPT dump permissions "$APK")"
          if printf '%s\n' "$PERMISSIONS" | grep -E 'com\.farsitel\.bazaar\.permission\.PAY_THROUGH_BAZAAR|android\.permission\.SYSTEM_ALERT_WINDOW|android\.permission\.USE_BIOMETRIC|android\.permission\.USE_FINGERPRINT'; then
            echo '::error::The Myket APK contains a prohibited Cafe Bazaar, overlay, or biometric permission.'
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"
          python3 tools/verify_android_apk_signature.py "$APKSIGNER" "$APK"
          echo 'Myket APK uses ai.visayar.app, version 2.3.24 (49), and contains neither prohibited permission.'

      - name: Scan release APKs with ClamAV
        run: |
          set -euo pipefail
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam --stdout
          clamscan --infected --no-summary "$APK"
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          if [ -f "release/Visayar-${RELEASE_VERSION}-Bazaar-Draft-universal.apk" ]; then
            clamscan --infected --no-summary "release/Visayar-${RELEASE_VERSION}-Bazaar-Draft-universal.apk"
            "$APKSIGNER" verify --verbose "release/Visayar-${RELEASE_VERSION}-Bazaar-Draft-universal.apk"
          fi
          echo "ClamAV scans and Android APK signature verification passed for all generated APKs."

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          if [ "${{ steps.resolve-release.outputs.bazaar_iab }}" = 'true' ]; then
            APK_NAME="Visayar-${RELEASE_VERSION}-CafeBazaar-IAB-universal.apk"
            cp mobile/android/app/build/outputs/apk/release/app-release.apk "release/$APK_NAME"
          elif [ "${{ steps.resolve-release.outputs.myket_iab }}" = 'true' ]; then
            APK_NAME="Visayar-${RELEASE_VERSION}-Myket-IAB-universal.apk"
            cp mobile/android/app/build/outputs/apk/release/app-release.apk "release/$APK_NAME"
          elif [ "${{ steps.resolve-release.outputs.bazaar_draft }}" = 'true' ]; then
            APK_NAME="Visayar-${RELEASE_VERSION}-Myket-Draft-universal.apk"
            cp mobile/android/app/build/outputs/apk/release/app-release.apk "release/$APK_NAME"
          else
            APK_NAME="Visayar-${RELEASE_VERSION}-universal.apk"
            cp mobile/android/app/build/outputs/apk/release/app-release.apk "release/$APK_NAME"
          fi
          ( cd release && sha256sum Visayar-*-universal.apk > SHA256SUMS.txt )
          cat release/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.resolve-release.outputs.bazaar_iab == 'true' && 'visayar-cafebazaar-iab-apk' || (steps.resolve-release.outputs.myket_iab == 'true' && 'visayar-myket-iab-apk' || (steps.resolve-release.outputs.bazaar_draft == 'true' && 'visayar-marketplace-registration-drafts' || 'zehnyar-release-apk')) }}
          path: |
            release/Visayar-*-universal.apk
            release/SHA256SUMS.txt
          retention-days: ${{ (steps.resolve-release.outputs.bazaar_draft == 'true' || steps.resolve-release.outputs.bazaar_iab == 'true' || steps.resolve-release.outputs.myket_iab == 'true') && 14 || 90 }}

      - name: Publish GitHub release
        if: ${{ steps.resolve-release.outputs.bazaar_draft != 'true' && steps.resolve-release.outputs.bazaar_iab != 'true' && steps.resolve-release.outputs.myket_iab != 'true' && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)) }}
        env:
          GH_TOKEN: ${{ github.token }}
          VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ ! "$VISAYAR_API_BASE_URL" =~ ^https://[^/]+([/].*)?$ ]]; then
            echo "Public release skipped: set VISAYAR_API_BASE_URL to the deployed HTTPS backend first."
            exit 0
          fi
          TAG="v${RELEASE_VERSION}"
          APK="release/Visayar-${RELEASE_VERSION}-universal.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              gh release upload "$TAG" "$APK" release/SHA256SUMS.txt --clobber
              gh release edit "$TAG" --title "Visayar ${RELEASE_VERSION} — Android release"
              echo "Release $TAG updated."
            else
              echo "Release $TAG already exists; branch validation build will not replace its assets."
            fi
          else
            gh release create "$TAG" "$APK" release/SHA256SUMS.txt \
              --title "Visayar ${RELEASE_VERSION} — Android release" \
              --notes-file docs/release-body.md
            echo "Release $TAG published."
          fi
