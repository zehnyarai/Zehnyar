name: Android release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number only, e.g. 2.3.14. Do not enter a branch name; empty uses the app version/tag.'
        required: false
        default: ''
      bazaar_draft:
        description: 'Build a non-public Cafe Bazaar registration draft (payments disabled)'
        required: false
        type: boolean
        default: true
      publish_release:
        description: 'Publish a public GitHub release (leave off for a test build)'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - 'arena/4143af50-zehnyar'
      - 'arena/96fa3fb8-zehnyar'
      - 'arena/5ee93ac8-zehnyar'
      - 'main'
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
      ANDROID_KEY_ALIAS: zehnyar
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'zehnyar-release-2026' }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'zehnyar-release-2026' }}
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version and build mode
        id: resolve-release
        run: |
          set -euo pipefail
          RAW="${{ github.event.inputs.version }}"
          BAZAAR_DRAFT=false
          if [[ "$RAW" == draft-* ]]; then
            BAZAAR_DRAFT=true
            RAW="${RAW#draft-}"
          elif [[ "${{ inputs.bazaar_draft }}" == "true" ]]; then
            BAZAAR_DRAFT=true
          fi
          if [ -z "$RAW" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RAW="${GITHUB_REF_NAME}"
          fi
          if [ -z "$RAW" ]; then
            RAW="$(node -p "require('./mobile/app.json').expo.version")"
          fi
          VERSION="${RAW#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Enter a version number such as 2.3.14 in the Version field; choose the branch only in the 'Use workflow from' dropdown."
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "bazaar_draft=$BAZAAR_DRAFT" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $VERSION"
          if [ "$BAZAAR_DRAFT" = true ]; then echo 'Building non-public Cafe Bazaar registration draft; payments remain disabled.'; fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild dataset and sync to the app bundle
        run: |
          python3 tools/build_dataset.py
          node tools/sync_mobile_data.js
          node tools/check_i18n.js
      - name: Block release when reference data is stale
        run: python3 tools/check_dataset_freshness.py --fail-when-stale

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Restore previous release signing key
        uses: actions/download-artifact@v4
        with:
          name: zehnyar-release-keystore
          path: previous-keystore
          run-id: 40639940668
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Configure stable release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -s previous-keystore/zehnyar-release.keystore ]; then
            cp previous-keystore/zehnyar-release.keystore "$ANDROID_KEYSTORE_PATH"
            echo "Restored the signing key used by the previous installable release."
          elif [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
            keytool -list -keystore "$ANDROID_KEYSTORE_PATH" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
            echo "Stable release signing key validated; key data hidden."
          else
            echo "No stable Android signing key is available; refusing to create a new key." >&2
            exit 1
          fi

      - name: Validate payment configuration without exposing card data
        if: ${{ steps.resolve-release.outputs.bazaar_draft != 'true' }}
        working-directory: mobile
        env:
          VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
          VISAYAR_PAYMENT_CARD_NUMBER: ${{ secrets.VISAYAR_PAYMENT_CARD_NUMBER }}
          VISAYAR_PAYMENT_CARD_HOLDER: ${{ secrets.VISAYAR_PAYMENT_CARD_HOLDER }}
          VISAYAR_PAYMENT_BANK_NAME: ${{ secrets.VISAYAR_PAYMENT_BANK_NAME }}
        run: |
          node <<'NODE'
          const config = require('./app.config.js');
          const card = config.extra.paymentCard || {};
          const rawCard = String(process.env.VISAYAR_PAYMENT_CARD_NUMBER || '').replace(/\D/g, '');
          const apiBase = String(process.env.VISAYAR_API_BASE_URL || '').trim();
          const secureApi = /^https:\/\/[^/]+(?:\/.*)?$/.test(apiBase);
          if (apiBase && !secureApi) {
            console.error('VISAYAR_API_BASE_URL must be a valid HTTPS URL.');
            process.exit(1);
          }
          if (rawCard && (!card.number || card.number.length !== 16)) {
            console.error('The configured static card secret is invalid.');
            process.exit(1);
          }
          if (!secureApi && (!card.number || card.number.length !== 16)) {
            console.error('Configure a secure HTTPS API URL, or add a valid card secret for offline mode.');
            process.exit(1);
          }
          console.log(secureApi ? 'Secure API configuration validated; card may be fetched from the server.' : 'Static card configuration validated; value hidden.');
          NODE

      - name: Embed an optional static card fallback for Android runtime
        if: ${{ steps.resolve-release.outputs.bazaar_draft != 'true' }}
        working-directory: mobile
        env:
          VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
          VISAYAR_PAYMENT_CARD_NUMBER: ${{ secrets.VISAYAR_PAYMENT_CARD_NUMBER }}
          VISAYAR_PAYMENT_CARD_HOLDER: ${{ secrets.VISAYAR_PAYMENT_CARD_HOLDER }}
          VISAYAR_PAYMENT_BANK_NAME: ${{ secrets.VISAYAR_PAYMENT_BANK_NAME }}
        run: node ../tools/write_mobile_payment_card.js

      - name: Prebuild Android project
        if: ${{ steps.resolve-release.outputs.bazaar_draft != 'true' }}
        working-directory: mobile
        env:
          VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
          EXPO_PUBLIC_VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
          VISAYAR_PAYMENT_CARD_NUMBER: ${{ secrets.VISAYAR_PAYMENT_CARD_NUMBER }}
          VISAYAR_PAYMENT_CARD_HOLDER: ${{ secrets.VISAYAR_PAYMENT_CARD_HOLDER }}
          VISAYAR_PAYMENT_BANK_NAME: ${{ secrets.VISAYAR_PAYMENT_BANK_NAME }}
        run: npx expo prebuild -p android --clean --no-install

      - name: Prebuild Cafe Bazaar registration draft without payment secrets
        if: ${{ steps.resolve-release.outputs.bazaar_draft == 'true' }}
        working-directory: mobile
        env:
          VISAYAR_API_BASE_URL: ''
          EXPO_PUBLIC_VISAYAR_API_BASE_URL: ''
          VISAYAR_PAYMENT_CARD_NUMBER: ''
          VISAYAR_PAYMENT_CARD_HOLDER: ''
          VISAYAR_PAYMENT_BANK_NAME: ''
        run: npx expo prebuild -p android --clean --no-install

      - name: Configure release signing
        run: node tools/android_prepare.js

      - name: Build release APK
        if: ${{ steps.resolve-release.outputs.bazaar_draft != 'true' }}
        working-directory: mobile/android
        env:
          VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
          EXPO_PUBLIC_VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
          VISAYAR_PAYMENT_CARD_NUMBER: ${{ secrets.VISAYAR_PAYMENT_CARD_NUMBER }}
          VISAYAR_PAYMENT_CARD_HOLDER: ${{ secrets.VISAYAR_PAYMENT_CARD_HOLDER }}
          VISAYAR_PAYMENT_BANK_NAME: ${{ secrets.VISAYAR_PAYMENT_BANK_NAME }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Build Cafe Bazaar registration draft APK
        if: ${{ steps.resolve-release.outputs.bazaar_draft == 'true' }}
        working-directory: mobile/android
        env:
          VISAYAR_API_BASE_URL: ''
          EXPO_PUBLIC_VISAYAR_API_BASE_URL: ''
          VISAYAR_PAYMENT_CARD_NUMBER: ''
          VISAYAR_PAYMENT_CARD_HOLDER: ''
          VISAYAR_PAYMENT_BANK_NAME: ''
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify card fallback or server-backed payments in the Android JS bundle
        if: ${{ steps.resolve-release.outputs.bazaar_draft != 'true' }}
        env:
          VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
          VISAYAR_PAYMENT_CARD_NUMBER: ${{ secrets.VISAYAR_PAYMENT_CARD_NUMBER }}
        run: node tools/check_mobile_payment_bundle.js

      - name: Remove generated card source from the workspace
        run: git show HEAD:mobile/src/core/paymentCard.generated.js > mobile/src/core/paymentCard.generated.js

      - name: Verify Cafe Bazaar registration package and embedded app bundle
        if: ${{ steps.resolve-release.outputs.bazaar_draft == 'true' }}
        run: |
          set -euo pipefail
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='ai.visayar.app'"
          "$AAPT" dump permissions "$APK" | grep -F 'android.permission.INTERNET'
          "$APKSIGNER" verify --verbose "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              names = set(apk.namelist())
          assert 'AndroidManifest.xml' in names, 'APK has no Android manifest'
          assert any(n.rsplit('/', 1)[-1].startswith('classes') and n.endswith('.dex') for n in names), 'APK has no dex payload'
          assert any(n.endswith(('.bundle', '.hbc')) for n in names), 'APK has no embedded JavaScript bundle'
          print('Production package and embedded app bundle verified for Bazaar draft registration.')
          PY

      - name: Scan release APK with ClamAV
        run: |
          set -euo pipefail
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam --stdout
          clamscan --infected --no-summary "$APK"
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          echo "ClamAV scan and Android APK signature verification passed."

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          if [ "${{ steps.resolve-release.outputs.bazaar_draft == 'true' }}" = 'true' ]; then
            APK_NAME="Visayar-${RELEASE_VERSION}-Bazaar-Draft-universal.apk"
          else
            APK_NAME="Visayar-${RELEASE_VERSION}-universal.apk"
          fi
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "release/$APK_NAME"
          ( cd release && sha256sum "$APK_NAME" > SHA256SUMS.txt )
          cat release/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.resolve-release.outputs.bazaar_draft == 'true' && 'visayar-cafebazaar-registration-draft' || 'zehnyar-release-apk' }}
          path: |
            release/Visayar-*-universal.apk
            release/SHA256SUMS.txt
          retention-days: ${{ steps.resolve-release.outputs.bazaar_draft == 'true' && 14 || 90 }}

      - name: Publish GitHub release
        if: ${{ steps.resolve-release.outputs.bazaar_draft != 'true' && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)) }}
        env:
          GH_TOKEN: ${{ github.token }}
          VISAYAR_API_BASE_URL: ${{ secrets.VISAYAR_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ ! "$VISAYAR_API_BASE_URL" =~ ^https://[^/]+([/].*)?$ ]]; then
            echo "Public release skipped: set VISAYAR_API_BASE_URL to the deployed HTTPS backend first."
            exit 0
          fi
          TAG="v${RELEASE_VERSION}"
          APK="release/Visayar-${RELEASE_VERSION}-universal.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              gh release upload "$TAG" "$APK" release/SHA256SUMS.txt --clobber
              gh release edit "$TAG" --title "Visayar ${RELEASE_VERSION} — Android release"
              echo "Release $TAG updated."
            else
              echo "Release $TAG already exists; branch validation build will not replace its assets."
            fi
          else
            gh release create "$TAG" "$APK" release/SHA256SUMS.txt \
              --title "Visayar ${RELEASE_VERSION} — Android release" \
              --notes-file docs/release-body.md
            echo "Release $TAG published."
          fi
