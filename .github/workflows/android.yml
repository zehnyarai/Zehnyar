name: Android release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 2.0.1 (empty = use the pushed tag)'
        required: false
        default: ''
  push:
    branches:
      - 'arena/7d04dbdc-zehnyar'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
      ANDROID_KEY_ALIAS: zehnyar
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'zehnyar-release-2026' }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'zehnyar-release-2026' }}
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        run: |
          set -euo pipefail
          RAW="${{ github.event.inputs.version }}"
          if [ -z "$RAW" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RAW="${GITHUB_REF_NAME}"
          fi
          if [ -z "$RAW" ]; then
            RAW="$(node -p "require('./mobile/app.json').expo.version")"
          fi
          VERSION="${RAW#v}"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved release version: $VERSION"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild dataset and sync to the app bundle
        run: |
          python3 tools/build_dataset.py
          node tools/sync_mobile_data.js
          node tools/check_i18n.js

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Restore or create the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
            echo "Using the keystore stored in repository secrets."
          else
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore "$ANDROID_KEYSTORE_PATH" \
              -alias "$ANDROID_KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" \
              -dname "CN=Visayar, OU=Mobile, O=Visayar, L=Amsterdam, C=NL"
            echo "Generated an ephemeral keystore. Store the uploaded keystore artifact in repository secrets to keep a stable signing key."
          fi

      - name: Prebuild Android project
        working-directory: mobile
        run: npx expo prebuild -p android --clean --no-install

      - name: Configure release signing
        run: node tools/android_prepare.js

      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          cp mobile/android/app/build/outputs/apk/release/app-release.apk \
             "release/Visayar-${RELEASE_VERSION}-universal.apk"
          cp "$ANDROID_KEYSTORE_PATH" release/zehnyar-release.keystore
          ( cd release && sha256sum "Visayar-${RELEASE_VERSION}-universal.apk" > SHA256SUMS.txt )
          cat release/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zehnyar-release-apk
          path: release/Visayar-*-universal.apk
          retention-days: 90

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: zehnyar-release-keystore
          path: release/zehnyar-release.keystore
          retention-days: 90

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          APK="release/Visayar-${RELEASE_VERSION}-universal.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              gh release upload "$TAG" "$APK" release/SHA256SUMS.txt --clobber
              gh release edit "$TAG" --title "Visayar ${RELEASE_VERSION} — Android release"
              echo "Release $TAG updated."
            else
              echo "Release $TAG already exists; branch validation build will not replace its assets."
            fi
          else
            gh release create "$TAG" "$APK" release/SHA256SUMS.txt \
              --title "Visayar ${RELEASE_VERSION} — Android release" \
              --notes-file docs/release-body.md
            echo "Release $TAG published."
          fi
