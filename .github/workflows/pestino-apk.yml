name: Build Pestino test APK

on:
  push:
    branches: [arena/e819b607-zehnyar]
  workflow_dispatch:
    inputs:
      server_url:
        description: "Public HTTPS Pestino site root (not the temporary Arena preview)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pestino-test-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  CAPACITOR_SERVER_URL: ${{ inputs.server_url || vars.PESTINO_SERVER_URL }}

jobs:
  configuration:
    outputs:
      ready: ${{ steps.identity.outputs.ready }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: identity
        name: Require the same stable Android identity (no debug installer)
        env:
          PESTINO_ANDROID_KEYSTORE_B64: ${{ secrets.PESTINO_ANDROID_KEYSTORE_B64 }}
          PESTINO_ANDROID_STORE_PASSWORD: ${{ secrets.PESTINO_ANDROID_STORE_PASSWORD }}
        run: python3 tools/signing_identity.py --ci-status
      - name: Explain the build prerequisite
        env:
          PUBLIC_SERVER: ${{ inputs.server_url || vars.PESTINO_SERVER_URL }}
        run: |
          if [ -z "$PUBLIC_SERVER" ]; then
            echo '## Pestino APK has not been built' >> "$GITHUB_STEP_SUMMARY"
            echo 'This optional ONLINE build requires a public HTTPS server. The FREE standalone edition is built separately by pestino-standalone.yml. Set the PESTINO_SERVER_URL repository variable after deployment, then push a new commit on arena/e819b607-zehnyar.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'A server URL is set; the build job will validate the actual Pestino API before packaging.' >> "$GITHUB_STEP_SUMMARY"
          fi

  apk:
    needs: configuration
    if: >-
      needs.configuration.outputs.ready == 'true' &&
      github.ref == 'refs/heads/arena/e819b607-zehnyar' &&
      (inputs.server_url != '' || vars.PESTINO_SERVER_URL != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate URL and published API
        run: |
          node tools/check-android-url.mjs
          python3 tools/check_online_server.py "$CAPACITOR_SERVER_URL"
      - name: Install dependencies and sync Android
        run: |
          npm ci
          npm run android:sync
      - name: Use the hosted runner Android SDK
        run: bash tools/prepare-android-sdk.sh
      - name: Build installable test APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Sign with the stable identity, never a fresh debug key
        env:
          PESTINO_ANDROID_KEYSTORE_B64: ${{ secrets.PESTINO_ANDROID_KEYSTORE_B64 }}
          PESTINO_ANDROID_STORE_PASSWORD: ${{ secrets.PESTINO_ANDROID_STORE_PASSWORD }}
          PESTINO_ANDROID_KEY_PASSWORD: ${{ secrets.PESTINO_ANDROID_KEY_PASSWORD }}
        run: bash tools/sign-compat-apk.sh
      - name: Verify package and signature
        run: |
          mkdir -p apk-output
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "apk-output/Pestino-$version.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "apk-output/Pestino-$version.apk" > apk-output/package-info.txt
          grep -q "name='ir.pestino.app'" apk-output/package-info.txt
          grep -q 'پستینو' apk-output/package-info.txt
          python3 - <<'PY'
          import json, os, zipfile
          with zipfile.ZipFile('apk-output/Pestino-' + json.load(open('package.json'))['version'] + '.apk') as apk:
              config = json.loads(apk.read('assets/capacitor.config.json'))
              assert config['appId'] == 'ir.pestino.app'
              assert config['appName'] == 'پستینو'
              assert config['server']['url'] == os.environ['CAPACITOR_SERVER_URL']
              assert 'classes.dex' in apk.namelist()
          PY
          (cd apk-output && sha256sum "Pestino-$version.apk" > "Pestino-$version.apk.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: pestino-test-apk
          path: apk-output/
          if-no-files-found: error
          retention-days: 30
      - name: Describe test limitations
        run: |
          echo '## Installable Pestino test APK' >> "$GITHUB_STEP_SUMMARY"
          echo 'Artifact: pestino-test-apk. This uses the pinned stable certificate; it does not repair historical random-key installs. Switching hosted/standalone mode is not a proven data migration. Real device testing, secure signing-key backup, scientific validation and service configuration are still required.' >> "$GITHUB_STEP_SUMMARY"
