name: Build Android APK

# APK آفلاین رشته‌یار: داده و صفحات داخل خود برنامه‌اند و به سرور یا اینترنت نیاز ندارد.
on:
  push:
    branches: [arena/b03df1da-zehnyar]
    paths:
      - 'reshteyar/android/**'
      - 'reshteyar/data/**'
      - 'reshteyar/app/static/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Sync offline data into Android assets
        run: python3 reshteyar/android/scripts/sync_assets.py

      - name: Build signed release APK
        working-directory: reshteyar/android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect and verify APK
        run: |
          set -euo pipefail
          cp reshteyar/android/app/build/outputs/apk/release/app-release.apk Reshteyar.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose Reshteyar.apk
          "$BT/apksigner" verify --print-certs Reshteyar.apk | tee signer.txt
          unzip -l Reshteyar.apk | grep -q 'assets/www/data/bundle.js'
          unzip -l Reshteyar.apk | grep -q 'assets/www/index.html'
          unzip -l Reshteyar.apk | grep -q 'classes.dex'
          ls -la Reshteyar.apk
          sha256sum Reshteyar.apk | tee Reshteyar.apk.sha256
          "$BT/aapt" dump badging Reshteyar.apk | grep -E "package:|sdkVersion|application-label" | tee badging.txt

      - uses: actions/upload-artifact@v4
        with:
          name: reshteyar-apk
          path: |
            Reshteyar.apk
            Reshteyar.apk.sha256
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-${GITHUB_RUN_NUMBER}" Reshteyar.apk Reshteyar.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "رشته‌یار APK (build ${GITHUB_RUN_NUMBER})" \
            --notes "نسخه‌ی اندروید رشته‌یار (آفلاین). فایل Reshteyar.apk را دانلود و نصب کنید. نیاز به اینترنت ندارد. اندروید ۵.۰ به بالا."
