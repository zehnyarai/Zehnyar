name: Isolated Android test APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/fe5d970d-zehnyar'

permissions:
  contents: read

jobs:
  build-test-apk:
    name: Build and scan no-network test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      VISAYAR_TEST_BUILD: '1'
      VISAYAR_API_BASE_URL: ''
      EXPO_PUBLIC_VISAYAR_API_BASE_URL: ''
      VISAYAR_PAYMENT_CARD_NUMBER: ''
      VISAYAR_PAYMENT_CARD_HOLDER: ''
      VISAYAR_PAYMENT_BANK_NAME: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build and validate shared data
        run: |
          python3 tools/build_dataset.py
          node tools/sync_mobile_data.js
          python3 tools/check_dataset_freshness.py --fail-when-stale
          node tools/check_i18n.js

      - name: Install app dependencies and run UI tests
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npm test -- --runInBand --silent

      - name: Verify test config has no API or payment account
        working-directory: mobile
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = require('./app.config.js');
          const card = config.extra.paymentCard || {};
          const fallbackSource = fs.readFileSync('./src/core/paymentCard.generated.js', 'utf8');
          if (/\d{16}/.test(fallbackSource)) {
            throw new Error('The checked-in payment fallback is not empty.');
          }
          if (!config.extra.testBuild || config.android.package !== 'ai.visayar.app.test') {
            throw new Error('Test-build isolation was not enabled.');
          }
          if (config.extra.apiBaseUrl || String(card.number || '').replace(/\D/g, '')) {
            throw new Error('Test builds must contain no API URL or payment account.');
          }
          console.log('Isolated test config validated; no API or payment values present.');
          NODE

      - name: Generate isolated Android project
        working-directory: mobile
        run: npx expo prebuild -p android --clean --no-install

      - name: Configure test-only release signing
        working-directory: mobile/android/app
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'build.gradle';
          let gradle = fs.readFileSync(file, 'utf8');
          const buildTypes = gradle.indexOf('buildTypes {');
          if (buildTypes < 0) throw new Error('Android buildTypes block not found.');
          const match = /\brelease\s*\{/g;
          match.lastIndex = buildTypes;
          const release = match.exec(gradle);
          if (!release) throw new Error('Android release build type not found.');
          const after = gradle.slice(release.index, release.index + 400);
          if (!/signingConfig\s+signingConfigs\.debug/.test(after)) {
            const token = release[0];
            const at = release.index + token.length;
            gradle = gradle.slice(0, at) + '\n            signingConfig signingConfigs.debug' + gradle.slice(at);
          }
          fs.writeFileSync(file, gradle);
          console.log('Test-only release variant will use the standard debug signing key.');
          NODE

      - name: Build standalone test APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Inspect test APK manifest
        run: |
          set -euo pipefail
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK"
          "$AAPT" dump permissions "$APK"

      - name: Verify isolated package identity
        run: |
          set -euo pipefail
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='ai.visayar.app.test'"

      - name: Verify test APK has no network permission
        run: |
          set -euo pipefail
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if "$AAPT" dump permissions "$APK" | grep -F 'android.permission.INTERNET'; then
            echo 'Network permission unexpectedly present in isolated test APK.' >&2
            exit 1
          fi
          echo 'No Android Internet permission found.'

      - name: Verify APK test signature
        run: |
          set -euo pipefail
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Verify standalone APK structure and JavaScript bundle
        run: python3 tools/check_test_apk.py mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Scan test APK with updated ClamAV definitions
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam --stdout
          clamscan --infected --no-summary mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare test APK and checksum
        run: |
          set -euo pipefail
          mkdir -p test-release
          cp mobile/android/app/build/outputs/apk/release/app-release.apk test-release/Visayar-Test.apk
          ( cd test-release && sha256sum Visayar-Test.apk > SHA256SUMS.txt )
          cat test-release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: visayar-isolated-test-apk
          path: |
            test-release/Visayar-Test.apk
            test-release/SHA256SUMS.txt
          retention-days: 14
