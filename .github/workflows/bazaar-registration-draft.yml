name: Cafe Bazaar registration draft APK

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build signed package-registration draft
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
      ANDROID_KEY_ALIAS: zehnyar
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'zehnyar-release-2026' }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'zehnyar-release-2026' }}
      VISAYAR_API_BASE_URL: ''
      EXPO_PUBLIC_VISAYAR_API_BASE_URL: ''
      VISAYAR_PAYMENT_CARD_NUMBER: ''
      VISAYAR_PAYMENT_CARD_HOLDER: ''
      VISAYAR_PAYMENT_BANK_NAME: ''
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate data and UI tests
        run: |
          python3 tools/build_dataset.py
          node tools/sync_mobile_data.js
          python3 tools/check_dataset_freshness.py --fail-when-stale
          node tools/check_i18n.js
          node tools/parity_check.js
        
      - name: Install app dependencies and run mobile tests
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npm test -- --runInBand --silent

      - name: Restore the existing release signing key
        uses: actions/download-artifact@v4
        with:
          name: zehnyar-release-keystore
          path: previous-keystore
          run-id: 40639940668
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Configure stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -s previous-keystore/zehnyar-release.keystore ]; then
            cp previous-keystore/zehnyar-release.keystore "$ANDROID_KEYSTORE_PATH"
            echo "Existing app signing key restored."
          elif [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
            keytool -list -keystore "$ANDROID_KEYSTORE_PATH" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
            echo "Existing app signing key validated."
          else
            echo "Stable app signing key unavailable; refusing to generate a different key." >&2
            exit 1
          fi

      - name: Generate the production-package Android project
        working-directory: mobile
        run: npx expo prebuild -p android --clean --no-install

      - name: Configure release signing
        run: node tools/android_prepare.js

      - name: Build Cafe Bazaar registration APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify package, network access, signature and bundled app
        run: |
          set -euo pipefail
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='ai.visayar.app'"
          "$AAPT" dump permissions "$APK" | grep -F 'android.permission.INTERNET'
          "$APKSIGNER" verify --verbose "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              names = set(apk.namelist())
          assert 'AndroidManifest.xml' in names, 'APK has no Android manifest'
          assert any(n.rsplit('/', 1)[-1].startswith('classes') and n.endswith('.dex') for n in names), 'APK has no dex payload'
          assert any(n.endswith(('.bundle', '.hbc')) for n in names), 'APK has no embedded JavaScript bundle'
          print('Standalone package and embedded app bundle verified.')
          PY

      - name: Scan draft APK with updated ClamAV definitions
        run: |
          set -euo pipefail
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam --stdout
          clamscan --infected --no-summary "$APK"

      - name: Prepare the Bazaar registration draft
        run: |
          set -euo pipefail
          mkdir -p bazaar-registration-draft
          cp mobile/android/app/build/outputs/apk/release/app-release.apk \
            bazaar-registration-draft/Visayar-Bazaar-Draft.apk
          (cd bazaar-registration-draft && sha256sum Visayar-Bazaar-Draft.apk > SHA256SUMS.txt)
          cat bazaar-registration-draft/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: visayar-cafebazaar-registration-draft
          path: |
            bazaar-registration-draft/Visayar-Bazaar-Draft.apk
            bazaar-registration-draft/SHA256SUMS.txt
          retention-days: 14
