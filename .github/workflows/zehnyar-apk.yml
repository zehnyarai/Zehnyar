name: قرآن‌پژوهه Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish or update the mobile-latest prerelease"
        required: true
        default: false
        type: boolean
      commit_apk:
        description: "Commit the built APK into release/ for direct pickup"
        required: false
        default: true
        type: boolean
  push:
    paths:
      - "quran/static/**"
      - "quran/mobile/**"
      - ".github/workflows/zehnyar-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Bring the allowlisted heavy tafsir sources from the app data branch
        # فقط طبری، قرطبی و المیزانِ نسخه‌دار دریافت می‌شوند؛ متنِ حذف‌شده در این بسته نیست.
        continue-on-error: true
        run: |
          git fetch --no-tags --depth=1 origin arena/b44e7de5-zehnyar
          mkdir -p quran/static/tafsir
          for file in \
            arabic-tabari-quran-com-api-1.1.json \
            arabic-qurtubi-quran-com-api-1.1.json \
            persian-mizan-furqan-2026.json; do
            if git cat-file -e "FETCH_HEAD:static/tafsir/$file" 2>/dev/null; then
              git show "FETCH_HEAD:static/tafsir/$file" > "quran/static/tafsir/$file"
            else
              echo "Optional pinned source not found: $file"
            fi
          done
          ls -lh quran/static/tafsir

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 10 -o /tmp/gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip; then
              break
            fi
            echo "Gradle download attempt $attempt failed; retrying..." >&2
            sleep 20
          done
          unzip -q /tmp/gradle-8.7-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"
          "$HOME/gradle-8.7/bin/gradle" --version | head -n 3

      - name: Verify Quran Pajoohe app identity
        run: grep -Fq 'android:label="قرآن‌پژوهه"' quran/mobile/android/app/src/main/AndroidManifest.xml

      - name: Build installable debug APK
        run: gradle --no-daemon -p quran/mobile/android assembleDebug

      - name: Name the Quran Pajoohe installer
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" quran/mobile/android/app/build.gradle | head -n1)"
          test -n "$VERSION"
          APK_PATH="quran/mobile/android/app/build/outputs/apk/debug/QuranPajoohe-${VERSION}.apk"
          cp quran/mobile/android/app/build/outputs/apk/debug/app-debug.apk "$APK_PATH"
          echo "QURAN_APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload Quran Pajoohe APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-pajoohe-android-apk
          path: ${{ env.QURAN_APK_PATH }}
          if-no-files-found: error

      - name: Publish latest prerelease
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          target_commitish: ${{ github.sha }}
          name: "قرآن‌پژوهه برای اندروید — آخرین نسخه"
          prerelease: true
          generate_release_notes: true
          files: ${{ env.QURAN_APK_PATH }}

      - name: Commit the built APK into the branch
        run: |
          set -euo pipefail
          mkdir -p release
          cp "$QURAN_APK_PATH" release/app-debug.apk
          ls -lh release/app-debug.apk
          git config user.name "zehnyar-apk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f release/app-debug.apk
          git commit -m "chore(apk): publish debug APK build [skip ci]" || echo "nothing to commit"
          git push origin HEAD
