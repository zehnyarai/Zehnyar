name: Zehnyar Quran APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish or update the mobile-latest prerelease"
        required: true
        default: true
        type: boolean
  push:
    paths:
      - "quran/static/**"
      - "quran/mobile/**"
      - ".github/workflows/zehnyar-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Bring heavy tafsir sources from the app branch
        # سه منبع حجیم (طبری، قرطبی، المیزان) در این شاخه نگه داشته نمی‌شوند؛
        # از شاخهٔ اپ بازیابی می‌شوند تا حجم مخزن سبک بماند.
        continue-on-error: true
        run: |
          git fetch --no-tags --depth=1 origin arena/b44e7de5-zehnyar
          mkdir -p /tmp/tafsir
          git archive FETCH_HEAD static/tafsir | tar -x -C /tmp
          cp -n /tmp/static/tafsir/*.json quran/static/tafsir/ || true
          ls -lh quran/static/tafsir

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build installable debug APK
        run: gradle --no-daemon -p quran/mobile/android assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zehnyar-android-apk
          path: quran/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish latest prerelease
        if: github.event_name == 'push' || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          target_commitish: ${{ github.sha }}
          name: "قرآن‌پژوهه برای اندروید — آخرین نسخه"
          prerelease: true
          generate_release_notes: true
          files: quran/mobile/android/app/build/outputs/apk/debug/app-debug.apk
