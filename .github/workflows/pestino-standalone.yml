name: Pestino free installable edition
on:
  push:
    branches: [arena/e819b607-zehnyar]
permissions:
  contents: read
concurrency:
  group: pestino-free-${{ github.ref }}
  cancel-in-progress: true
jobs:
  signing:
    name: Stable signing readiness (no fallback identity)
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.identity.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Require an approved certificate and durable private signing material
        id: identity
        env:
          PESTINO_ANDROID_KEYSTORE_B64: ${{ secrets.PESTINO_ANDROID_KEYSTORE_B64 }}
          PESTINO_ANDROID_STORE_PASSWORD: ${{ secrets.PESTINO_ANDROID_STORE_PASSWORD }}
        run: python3 tools/signing_identity.py --ci-status

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check && npm test
      - name: Build free iPhone web edition
        env:
          VITE_BASE_PATH: /Zehnyar/
        run: npm run build:standalone
      - run: npx playwright install --with-deps chromium
      - name: Test local storage, photos, backups and fully offline operation
        # The log is kept in the runner so failures can be annotated for the API, because
        # this project's sandbox cannot download the raw job log from the CDN.
        run: |
          # Stream the runner's output into annotations, because this project's sandbox
          # cannot download raw job logs. Only meaningful lines are kept to stay under the
          # annotation limit.
          set -o pipefail
          set +e
          npm run test:standalone -- --project=chromium --reporter=line > /tmp/e2e.log 2>&1
          code=$?
          set -e
          tail -c 120000 /tmp/e2e.log
          if [ "$code" -ne 0 ]; then
            python3 - <<'PYDUMP'
          from pathlib import Path
          lines = [l.rstrip() for l in Path('/tmp/e2e.log').read_text(errors='ignore').splitlines() if l.strip()]
          important = [l for l in lines if any(token in l for token in ('Error:', 'Timeout', 'Expected', 'Received', 'Locator:', 'toContain', 'toHave', 'tests/standalone/') )]
          for line in important[:10]:
              print('::error title=E2E::' + line.replace('%', '%25')[:900])
          PYDUMP
          fi
          exit $code
      - name: Check the public market adapter against raw publisher HTML (optional network smoke)
        continue-on-error: true
        env:
          PESTINO_LIVE_MARKET: '1'
        run: npm run test:standalone -- --project=chromium --grep 'live public source adapter smoke' --reporter=line
      - name: Expose failed browser context without external log downloads
        if: failure()
        run: |
          python3 - <<'PYCONTEXT'
          from pathlib import Path
          for p in Path('test-results').rglob('ui-context.json'):
              value = p.read_text().replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice title=Standalone UI context::' + value)
          PYCONTEXT
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pestino-browser-test-results
          path: test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  apk:
    needs: signing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Package all assets locally, with no server URL
        run: npm ci && npm run android:standalone
      - name: Use the hosted runner Android SDK
        run: bash tools/prepare-android-sdk.sh
      - name: Compile unsigned release and test fixtures (not distributable)
        working-directory: android
        run: |
          set +e
          ./gradlew :app:assembleRelease --no-daemon --stacktrace > gradle-build.log 2>&1
          result=$?
          cat gradle-build.log
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYLOG'
          from pathlib import Path
          message = '\n'.join(Path('gradle-build.log').read_text().splitlines()[-180:])
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Android compiler diagnostics::' + message)
          PYLOG
          fi
          exit "$result"
      - name: Sign ONLY with the pinned stable certificate
        if: needs.signing.outputs.ready == 'true'
        env:
          PESTINO_ANDROID_KEYSTORE_B64: ${{ secrets.PESTINO_ANDROID_KEYSTORE_B64 }}
          PESTINO_ANDROID_STORE_PASSWORD: ${{ secrets.PESTINO_ANDROID_STORE_PASSWORD }}
          PESTINO_ANDROID_KEY_PASSWORD: ${{ secrets.PESTINO_ANDROID_KEY_PASSWORD }}
        run: bash tools/sign-compat-apk.sh
      - name: Verify actual installer and self-contained configuration
        if: needs.signing.outputs.ready == 'true'
        run: |
          mkdir -p apk-output
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          test -s "apk-output/Pestino-$version.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "apk-output/Pestino-$version.apk" | tee apk-output/signature-info.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "apk-output/Pestino-$version.apk" > apk-output/package-info.txt
          grep -q "name='ir.pestino.app'" apk-output/package-info.txt
          grep -q 'پستینو' apk-output/package-info.txt
          # APK's declared minSdk is 24, so default verification may skip v1.
          # Verify JAR compatibility explicitly, without changing app minSdk.
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --min-sdk-version 23 --max-sdk-version 23 "apk-output/Pestino-$version.apk" | tee apk-output/signature-v1-info.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' apk-output/signature-v1-info.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' apk-output/signature-info.txt
          python3 - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('apk-output/Pestino-' + json.load(open('package.json'))['version'] + '.apk') as apk:
              config = json.loads(apk.read('assets/capacitor.config.json'))
              assert config['appId'] == 'ir.pestino.app'
              assert config['appName'] == 'پستینو'
              assert not config.get('server', {}).get('url')
              assert 'classes.dex' in apk.namelist()
              assert 'assets/public/index.html' in apk.namelist()
              assert any(p.startswith('assets/public/assets/') and p.endswith('.js') for p in apk.namelist())
          PY
          (cd apk-output && sha256sum "Pestino-$version.apk" > "Pestino-$version.apk.sha256")
      - name: Build dummy-key AndroidKeyStore instrumentation tests
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
          mkdir -p ../native-test-output
          cp app/build/outputs/apk/debug/app-debug.apk ../native-test-output/keyvault-app.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ../native-test-output/keyvault-tests.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pestino-key-vault-tests
          path: native-test-output/
          retention-days: 7
      - name: Expose signing diagnostics if verification fails
        if: failure()
        run: |
          python3 - <<'PYSIGN'
          from pathlib import Path
          for p in Path('apk-output').glob('*info.txt'):
              value = p.read_text().replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice title=APK verification details::' + value)
          PYSIGN
      - uses: actions/upload-artifact@v4
        if: needs.signing.outputs.ready == 'true'
        with:
          name: pestino-android-installer
          path: apk-output/
          retention-days: 7

  install:
    needs: [apk, signing]
    env:
      PESTINO_RELEASE_READY: ${{ needs.signing.outputs.ready }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.signing.outputs.ready == 'true'
        with:
          name: pestino-android-installer
          path: apk-output
      - uses: actions/download-artifact@v4
        with:
          name: pestino-key-vault-tests
          path: native-test-output
      - name: Allow emulator hardware acceleration
        run: |
          sudo chmod 666 /dev/kvm
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Prove key retention and test the signed installer only when configured
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: |
            bash tools/check-key-storage.sh
            if [ "$PESTINO_RELEASE_READY" = "true" ]; then bash tools/check-android-install.sh; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pestino-launch-api-${{ matrix.api }}
          path: |
            apk-output/launch-ui.xml
            apk-output/launch-screen.png
          retention-days: 7

  deploy:
    if: vars.PESTINO_PAGES_ENABLED == 'true'
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish only the free static web edition, no API or paid host
        id: deployment
        uses: actions/deploy-pages@v4

  deliver:
    # Exactly one user-requested small APK is retained on this session branch
    # because download CDNs are unavailable in the agent sandbox. No SDK,
    # cache, signing key or user dataset is checked into Git.
    # Native assets do not use a service worker; PWA cache testing is independent.
    needs: [web, apk, install, signing]
    if: needs.signing.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/e819b607-zehnyar
      - name: Reject identity rotation against the existing stable delivery
        run: python3 -c 'from tools.signing_identity import load_identity, check_previous; check_previous(load_identity())'
      - uses: actions/download-artifact@v4
        with:
          name: pestino-android-installer
          path: installers
      - name: Publish the requested verified installer on the session branch only
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PYPIN'
          import json, hashlib, os
          from pathlib import Path
          from tools.signing_identity import load_identity, check_previous
          identity = load_identity()
          check_previous(identity)
          record = json.loads(Path('installers/SIGNING.json').read_text())
          assert record['source_commit'] == os.environ['GITHUB_SHA']
          assert record['certificate_sha256'] == identity['certificate_sha256']
          assert hashlib.sha256(Path('installers', record['apk_name']).read_bytes()).hexdigest() == record['apk_sha256']
          PYPIN
          printf 'Built source commit: %s\nThis APK uses the pinned stable signing identity recorded in SIGNING.json. It is NOT an in-place upgrade for an older random-key installer. Never uninstall the existing app to bypass signature mismatch. Saved provider keys remain device-private; no live owner-account or diagnostic-accuracy certification.\n' "$GITHUB_SHA" > installers/BUILD.txt
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          git add "installers/Pestino-$version.apk" "installers/Pestino-$version.apk.sha256" installers/package-info.txt installers/signature-info.txt installers/signature-v1-info.txt installers/BUILD.txt installers/SIGNING.json
          git commit -m 'Deliver verified self-contained Pestino Android installer' || exit 1
          git push origin arena/e819b607-zehnyar
