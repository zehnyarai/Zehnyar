name: Pestino free installable edition
on:
  push:
    branches: [arena/e819b607-zehnyar]
permissions:
  contents: read
concurrency:
  group: pestino-free-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check && npm test
      - name: Build free iPhone web edition
        env:
          VITE_BASE_PATH: /Zehnyar/
        run: npm run build:standalone
      - run: npx playwright install --with-deps chromium webkit
      - name: Test local storage, photos, backups and fully offline operation
        run: npm run test:standalone -- --reporter=github
      - name: Expose failed browser context without external log downloads
        if: failure()
        run: |
          python3 - <<'PYCONTEXT'
          from pathlib import Path
          for p in Path('test-results').rglob('ui-context.json'):
              value = p.read_text().replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice title=Standalone UI context::' + value)
          PYCONTEXT
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pestino-browser-test-results
          path: test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Package all assets locally, with no server URL
        run: npm ci && npm run android:standalone
      - name: Use the hosted runner Android SDK
        run: bash tools/prepare-android-sdk.sh
      - name: Build signed installable test APK
        working-directory: android
        run: |
          set +e
          ./gradlew :app:assembleRelease --no-daemon --stacktrace > gradle-build.log 2>&1
          result=$?
          cat gradle-build.log
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYLOG'
          from pathlib import Path
          message = '\n'.join(Path('gradle-build.log').read_text().splitlines()[-180:])
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Android compiler diagnostics::' + message)
          PYLOG
          fi
          exit "$result"
      - name: Sign a non-debug compatibility installer (v1, v2 and v3)
        run: bash tools/sign-compat-apk.sh
      - name: Verify actual installer and self-contained configuration
        run: |
          mkdir -p apk-output
          test -s apk-output/Pestino-0.1.1.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose apk-output/Pestino-0.1.1.apk | tee apk-output/signature-info.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging apk-output/Pestino-0.1.1.apk > apk-output/package-info.txt
          grep -q "name='ir.pestino.app'" apk-output/package-info.txt
          grep -q 'پستینو' apk-output/package-info.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' apk-output/signature-info.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' apk-output/signature-info.txt
          python3 - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('apk-output/Pestino-0.1.1.apk') as apk:
              config = json.loads(apk.read('assets/capacitor.config.json'))
              assert config['appId'] == 'ir.pestino.app'
              assert config['appName'] == 'پستینو'
              assert not config.get('server', {}).get('url')
              assert 'classes.dex' in apk.namelist()
              assert 'assets/public/index.html' in apk.namelist()
              assert any(p.startswith('assets/public/assets/') and p.endswith('.js') for p in apk.namelist())
          PY
          (cd apk-output && sha256sum Pestino-0.1.1.apk > Pestino-0.1.1.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: pestino-android-installer
          path: apk-output/
          retention-days: 7


  install:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pestino-android-installer
          path: apk-output
      - name: Allow emulator hardware acceleration
        run: |
          sudo chmod 666 /dev/kvm
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install and launch the actual APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: bash tools/check-android-install.sh

  deploy:
    if: vars.PESTINO_PAGES_ENABLED == 'true'
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish only the free static web edition, no API or paid host
        id: deployment
        uses: actions/deploy-pages@v4

  deliver:
    # Exactly one user-requested small APK is retained on this session branch
    # because download CDNs are unavailable in the agent sandbox. No SDK,
    # cache, signing key or user dataset is checked into Git.
    # Native assets do not use a service worker; PWA cache testing is independent.
    needs: [apk, install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/e819b607-zehnyar
      - uses: actions/download-artifact@v4
        with:
          name: pestino-android-installer
          path: installers
      - name: Publish the requested verified installer on the session branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf 'Built source commit: %s\nThis APK is a non-debug, test-key-signed local-only compatibility build, with no image diagnosis or payment.\n' "$GITHUB_SHA" > installers/BUILD.txt
          git add installers/Pestino-0.1.1.apk installers/Pestino-0.1.1.apk.sha256 installers/package-info.txt installers/signature-info.txt installers/BUILD.txt
          git commit -m 'Deliver verified self-contained Pestino Android installer' || exit 1
          git push origin arena/e819b607-zehnyar
