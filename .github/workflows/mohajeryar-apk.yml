name: Build Mohajeryar APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish or update the apk-mohajeryar prerelease"
        required: true
        default: true
        type: boolean
  push:
    paths:
      - "mohajeryar/mobile/**"
      - "mohajeryar/app/static/**"
      - ".github/workflows/mohajeryar-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build installable debug APK
        run: gradle --no-daemon -p mohajeryar/mobile/android assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mohajeryar-android-apk
          path: mohajeryar/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish latest prerelease
        if: github.event_name == 'push' || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-mohajeryar
          target_commitish: ${{ github.sha }}
          name: "مهاجریار برای اندروید — آخرین نسخه"
          body: |
            نسخهٔ اندروید مهاجریار (WebView).

            در نخستین اجرا آدرس سرور مهاجریار را وارد کنید؛ برنامه اتصال را با `/api/health` می‌سنجد.
            راهنمای اجرای سرور در `mohajeryar/README.md` آمده است.
          prerelease: true
          generate_release_notes: true
          files: mohajeryar/mobile/android/app/build/outputs/apk/debug/app-debug.apk
