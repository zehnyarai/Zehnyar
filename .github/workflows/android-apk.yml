name: Android debug APK

# Builds an installable debug APK for testing on a physical device.
# Run manually: Actions -> "Android debug APK" -> Run workflow, then enter the API base URL.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL, e.g. https://api.example.com (no trailing slash)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pestino/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # Generates the Gradle wrapper and other missing Android files.
      # Existing Pestino files (Gradle config, manifests, MainActivity) are kept.
      - name: Generate missing Android scaffolding
        run: |
          flutter create --platforms=android --org ir.pestino --project-name pestino .
          rm -f test/widget_test.dart

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=${{ inputs.api_base_url }}

      - uses: actions/upload-artifact@v4
        with:
          name: pestino-debug-apk
          path: pestino/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
