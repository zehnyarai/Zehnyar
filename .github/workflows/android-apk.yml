name: Android debug APK

# Builds an installable debug APK for testing on a physical device.
# Run manually: Actions -> "Android debug APK" -> Run workflow, then enter the API base URL.
on:
  push:
    branches: [arena/2d850d62-zehnyar]
    paths: [".github/workflows/android-apk.yml", "pestino/mobile/**"]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL, e.g. https://api.example.com (no trailing slash)"
        required: false
        type: string

env:
  # Default API for device testing (temporary test backend). Override with the
  # workflow_dispatch input. Production builds must use the real HTTPS API URL.
  DEFAULT_API_BASE_URL: https://8080-iylqzvd51zrjor4p6kxj8.e2b.app

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pestino/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # flutter create generates the template (Gradle wrapper, etc.). Our Android files
      # are then copied back on top, so signing config, manifests and Gradle version stay ours.
      - name: Generate Android project (template + Pestino overrides)
        run: |
          SAVED="$(mktemp -d)"
          cp -r android "$SAVED"/
          flutter create --platforms=android --org ir.pestino --project-name pestino .
          cp -r "$SAVED"/android/. android/
          rm -f test/widget_test.dart

      - run: flutter pub get

      # Converts analyzer findings into GitHub annotations so they are visible in the
      # check-run annotations even when job logs are not available.
      - name: Analyze
        run: |
          flutter analyze --format=machine > analyze.txt 2>&1 || true
          python3 - <<'PY'
          import sys
          errors = 0
          for line in open("analyze.txt", encoding="utf-8", errors="replace"):
              parts = line.rstrip("\n").split("|", 7)
              if len(parts) < 8 or parts[0] not in ("ERROR", "WARNING", "INFO"):
                  continue
              sev, _, code, path, ln, col, _, msg = parts
              level = {"ERROR": "error", "WARNING": "warning"}.get(sev, "notice")
              if sev == "ERROR":
                  errors += 1
              print(f"::{level} file={path},line={ln},col={col}::[{code}] {msg}")
          print(f"Analyzer errors: {errors}")
          sys.exit(1 if errors else 0)
          PY

      - name: Unit tests
        run: flutter test

      - name: Build debug APK
        run: |
          API_URL="${{ inputs.api_base_url }}"
          if [ -z "$API_URL" ]; then API_URL="$DEFAULT_API_BASE_URL"; fi
          echo "Building against $API_URL"
          set +e
          flutter build apk --debug --dart-define=API_BASE_URL="$API_URL" > build.log 2>&1
          code=$?
          set -e
          cat build.log | tail -150
          if [ $code -ne 0 ]; then
            python3 - <<'PY'
          import re
          text = open("build.log", encoding="utf-8", errors="replace").read()
          lines = [l.strip() for l in re.split(r"[\r\n]+", text)]
          # Drop progress-bar noise (SDK/NDK downloads) so the real error stays visible.
          lines = [l for l in lines if l and "%" not in l and not l.startswith("[") and "Downloading" not in l and "Unzipping" not in l]
          msg = "\n".join(lines[-100:])[-30000:].replace("%", "%25").replace("\n", "%0A")
          print(f"::error title=APK build failed::{msg}")
          PY
          fi
          exit $code

      - name: Locate APK outputs (diagnostics)
        if: always()
        run: |
          echo "::notice title=APK search::$(find build -name '*.apk' 2>/dev/null | tr '\n' ' ')"
          echo "::notice title=Gradle outputs::$(find android/app/build -maxdepth 4 -type d 2>/dev/null | head -30 | tr '\n' ' ')"

      - uses: actions/upload-artifact@v4
        with:
          name: pestino-debug-apk
          path: pestino/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
