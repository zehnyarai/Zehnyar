name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish or update the mobile-latest prerelease"
        required: true
        default: true
        type: boolean
  push:
    paths:
      - "mobile/**"
      - "static/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build installable debug APK
        run: gradle --no-daemon -p mobile/android assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zehnyar-android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish latest prerelease
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: "ذهن‌یار برای اندروید — آخرین نسخه"
          prerelease: true
          generate_release_notes: true
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
