<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>مدیریت پرداخت‌ها | ویزایار</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#153d3a;background:#f3faf9}*{box-sizing:border-box}body{margin:0}header{padding:28px max(20px,calc((100vw - 980px)/2));background:linear-gradient(120deg,#0b6e63,#4fa9ce);color:white}h1{margin:0 0 6px;font-size:24px}header p{margin:0;opacity:.84}.wrap{max-width:980px;margin:24px auto;padding:0 18px}.panel,.order{background:#fff;border:1px solid #d9eae6;border-radius:18px;padding:18px;box-shadow:0 8px 24px #0b6e6310;margin-bottom:16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.login input{flex:1;min-width:220px}input{font:inherit;border:1px solid #cbded9;border-radius:11px;padding:12px;background:#fff;color:#173d39}button{font:inherit;font-weight:700;border:0;border-radius:11px;padding:12px 17px;background:#0b6e63;color:#fff;cursor:pointer}button.secondary{background:#e7f4f1;color:#0b6e63}button.reject{background:#fff0ed;color:#ad3a31}button:disabled{opacity:.55;cursor:wait}.muted{color:#64807c;font-size:13px}.error{color:#a5362d}.summary{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.order h2{font-size:17px;margin:0}.order-grid{display:grid;grid-template-columns:1fr minmax(220px,360px);gap:16px;margin-top:12px}.details{display:grid;grid-template-columns:110px 1fr;gap:9px;align-content:start}.details b{color:#64807c;font-weight:500}.proof{width:100%;max-height:380px;object-fit:contain;background:#f1f5f4;border-radius:12px;border:1px solid #e0eae8}.actions{display:flex;gap:8px;margin-top:14px}.status{border-radius:999px;background:#fff2d5;color:#795716;padding:5px 10px;font-size:12px}@media(max-width:650px){.order-grid{grid-template-columns:1fr}.proof{max-height:300px}}
</style>
</head>
<body>
<header><h1>بررسی رسیدهای ویزایار</h1><p>رسید بانکی را با مبلغ و شناسهٔ پیگیری تطبیق دهید؛ فقط پس از تأیید واقعی اعتبار بدهید.</p></header>
<main class="wrap">
<section class="panel">
<div class="row login"><input id="token" type="password" autocomplete="current-password" placeholder="رمز مدیر" aria-label="رمز مدیر"><button id="login">ورود و دریافت درخواست‌ها</button><button class="secondary" id="refresh">به‌روزرسانی</button></div>
<p class="muted">رمز فقط تا پایان همین نشست مرورگر نگه داشته می‌شود. این صفحه را فقط روی HTTPS و دستگاه امن باز کنید.</p><p id="message" class="muted" role="status"></p>
</section>
<section id="orders" aria-live="polite"></section>
</main>
<script>
const tokenInput=document.querySelector('#token'), message=document.querySelector('#message'), orders=document.querySelector('#orders');
tokenInput.value=sessionStorage.getItem('visayar-admin-token')||'';
const labels={assessment_1:'یک ارزیابی',assessment_3:'سه ارزیابی',assessment_6:'شش ارزیابی',assessment_12:'دوازده ارزیابی'};
function auth(){return {'X-Admin-Token':tokenInput.value.trim()}}
function showMessage(text,error=false){message.textContent=text;message.className=error?'error':'muted'}
async function load(){const t=tokenInput.value.trim();if(!t){showMessage('رمز مدیر را وارد کنید.',true);return}sessionStorage.setItem('visayar-admin-token',t);showMessage('در حال دریافت درخواست‌ها…');orders.replaceChildren();try{const r=await fetch('/api/admin/payments',{headers:auth(),cache:'no-store'});if(!r.ok)throw new Error(r.status===403?'رمز مدیر درست نیست.':'دریافت درخواست‌ها ناموفق بود.');const data=await r.json();if(!data.items.length){showMessage('درخواست در انتظار بررسی وجود ندارد.');return}showMessage(`درخواست‌های در انتظار: ${data.items.length}`);for(const item of data.items)orders.append(makeOrder(item))}catch(e){showMessage(e.message||'خطا در ارتباط با سرور.',true)}}
function pair(label,value){const a=document.createElement('b'),b=document.createElement('span');a.textContent=label;b.textContent=value;return[a,b]}
function makeOrder(item){const card=document.createElement('article');card.className='order';const top=document.createElement('div');top.className='summary';const title=document.createElement('h2');title.textContent=labels[item.sku]||'بستهٔ ارزیابی';const status=document.createElement('span');status.className='status';status.textContent='در انتظار بررسی';top.append(title,status);card.append(top);const grid=document.createElement('div');grid.className='order-grid';const detail=document.createElement('div');detail.className='details';for(const [k,v] of [['مبلغ',`${Number(item.priceToman).toLocaleString('fa-IR')} تومان`],['اعتبار',`${Number(item.credits).toLocaleString('fa-IR')} ارزیابی`],['شماره همراه',item.phone],['شناسه پیگیری',item.trackingCode],['زمان ثبت',new Date(item.createdAt).toLocaleString('fa-IR')],['شناسه نصب',item.installId]])for(const el of pair(k,v))detail.append(el);const img=document.createElement('img');img.className='proof';img.alt='تصویر رسید پرداخت';img.src='';fetch(`/api/admin/payments/${encodeURIComponent(item.id)}/receipt`,{headers:auth(),cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.blob()}).then(blob=>{img.src=URL.createObjectURL(blob)}).catch(()=>{img.alt='تصویر رسید دریافت نشد'});grid.append(detail,img);card.append(grid);const actions=document.createElement('div');actions.className='actions';for(const [label,path,cls] of [['تأیید و افزودن اعتبار','approve',''],['رد درخواست','reject','reject']]){const button=document.createElement('button');button.textContent=label;if(cls)button.className=cls;button.onclick=()=>decide(item.id,path,button);actions.append(button)}card.append(actions);return card}
async function decide(id,action,button){const promptText=action==='approve'?'آیا رسید را با تراکنش بانکی تطبیق دادید؟':'آیا درخواست را رد می‌کنید؟';if(!window.confirm(promptText))return;button.disabled=true;try{const r=await fetch(`/api/admin/payments/${encodeURIComponent(id)}/${action}`,{method:'POST',headers:auth()});if(!r.ok)throw new Error('عملیات انجام نشد.');showMessage(action==='approve'?'پرداخت تأیید شد و اعتبار افزوده شد.':'درخواست رد شد.');await load()}catch(e){showMessage(e.message||'خطا در ارتباط با سرور.',true);button.disabled=false}}
document.querySelector('#login').onclick=load;document.querySelector('#refresh').onclick=load;tokenInput.addEventListener('keydown',e=>{if(e.key==='Enter')load()});
</script>
</body></html>
